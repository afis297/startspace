<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Startspace</title>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />

  <body>

      <img id="wallpaper-layer" alt="" aria-hidden="true" />

      <aside id="properties-panel" class="side-panel" hidden aria-label="Свойства виджета"></aside>

      <div id="toast-region" class="toast-region" aria-live="polite"></div>
