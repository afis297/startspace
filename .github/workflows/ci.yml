name: ci

on:
  push:
  pull_request:

jobs:
  node-smokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm test
      - run: npm run test:all
  ps1-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          ./validate-project.ps1
          ./audit-project.ps1
